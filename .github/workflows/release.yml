name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release, and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check release version
        run: node scripts/check-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Compute release metadata
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          artifact="churchtools-mcp-server-${tag}.tgz"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Package npm build output
        run: |
          mkdir -p release
          tar -czf "release/${{ steps.release.outputs.artifact }}" dist package.json package-lock.json README.md VERSION

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release.outputs.tag }}"; then
            echo "::error::Tag ${{ steps.release.outputs.tag }} already exists."
            exit 1
          fi

          git tag "${{ steps.release.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Automated release for version ${{ steps.release.outputs.version }} from ${GITHUB_SHA}.

          Docker image:
          - ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          - ${{ steps.release.outputs.image }}:latest"

          gh release create "${{ steps.release.outputs.tag }}" "release/${{ steps.release.outputs.artifact }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes "$notes"
